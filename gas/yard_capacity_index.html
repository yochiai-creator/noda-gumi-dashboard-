<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <?!= yardInclude_('yard_capacity_style'); ?>
</head>
<body>
  <div class="app-header">
    <div class="app-header-text">
      <div class="app-brand">
        <span class="app-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M9 2h6a1 1 0 0 1 1 1v2.2c1.2.9 2 2.4 2 4.1V20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9.3c0-1.7.8-3.2 2-4.1V3a1 1 0 0 1 1-1zm1 2v1.6h4V4h-4zM8 9.3V20h8V9.3c0-1.6-1-3-2.4-3.5a1 1 0 0 1-.6-.9V6h-2v-.1a1 1 0 0 1-.6.9C9 6.3 8 7.7 8 9.3z"/>
          </svg>
        </span>
        <h1>LPG容器 屋外置場 在庫管理</h1>
      </div>
      <p class="app-subtitle">屋外置場ごとの容器実績数・収容MAXを管理します</p>
    </div>
    <button id="addBtn" class="primary-btn">＋ 新規置場登録</button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input id="keyword" type="text" placeholder="番号・置場名・位置・備考で検索">
    </div>
    <label class="checkbox">
      <input id="onlyNearFull" type="checkbox">
      満杯に近い置場のみ(80%以上)
    </label>
    <button id="searchBtn">検索</button>
    <div class="spacer"></div>
    <button id="renumberBtn" class="secondary">番号を振り直す</button>
    <div class="view-toggle">
      <button id="viewListBtn" class="toggle-btn active">一覧表示</button>
      <button id="viewMapBtn" class="toggle-btn">敷地レイアウト表示</button>
    </div>
  </div>

  <div id="tableView" class="panel table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>番号</th>
          <th>置場名</th>
          <th>20kg</th>
          <th>30kg</th>
          <th>50kg</th>
          <th>備考</th>
          <th>更新</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyMsg" class="empty">読み込み中...</div>
  </div>

  <div id="mapView" class="panel map-wrap" style="display:none;">
    <div class="map-legend">
      <span class="legend-item"><span class="legend-dot level-ok"></span>余裕あり</span>
      <span class="legend-item"><span class="legend-dot level-warn"></span>80%以上</span>
      <span class="legend-item"><span class="legend-dot level-over"></span>満杯(100%以上)</span>
      <span class="legend-item"><span class="legend-dot level-empty"></span>MAX未設定</span>
      <span class="legend-hint" id="mapLegendHint">灰色の四角は建屋の参考位置です。丸をクリックすると編集できます。</span>
      <div class="spacer"></div>
      <button id="assetZoneBtn" class="secondary">資産配置図(S/G番号)</button>
      <button id="placementEditBtn" class="secondary">配置を編集</button>
      <button id="buildingEditBtn" class="secondary">建物を編集</button>
      <button id="addAreaZoneBtn" class="secondary">＋ エリアを囲む</button>
    </div>
    <div id="assetZoneLegend" class="asset-zone-legend" style="display:none;">
      <span class="asset-legend-title">容器製品品種</span>
      <span class="legend-item"><span class="asset-swatch" style="background:#f5e02a;border-color:#b8a500;"></span>50K</span>
      <span class="legend-item"><span class="asset-swatch" style="background:#f0b23c;border-color:#b07c14;"></span>20K</span>
      <span class="legend-item"><span class="asset-swatch" style="background:#2b93e0;border-color:#1a6aa8;"></span>小容器(2〜10K)</span>
      <span class="legend-item"><span class="asset-swatch" style="background:#d5474f;border-color:#9c2b32;"></span>50K(S)</span>
      <span class="legend-item"><span class="asset-swatch" style="background:#8dc37c;border-color:#5b8c4c;"></span>30K</span>
      <span class="legend-item"><span class="asset-swatch" style="background:#3d3e7a;border-color:#26264f;"></span>小容器又は20K</span>
      <span class="legend-item"><span class="asset-swatch" style="background:#c9d0da;border-color:#77808d;"></span>原材料(G)</span>
      <span class="legend-hint">原本の資産配置図をもとにした概略位置です。</span>
    </div>
    <div id="buildingEditPanel" class="building-edit-panel" style="display:none;">
      <span id="buildingEditName" class="building-edit-name"></span>
      <button id="buildingRotateCCW" class="secondary">↺ 回転</button>
      <button id="buildingRotateCW" class="secondary">回転 ↻</button>
      <button id="buildingScaleDown" class="secondary">－ 縮小</button>
      <button id="buildingScaleUp" class="secondary">＋ 拡大</button>
      <button id="buildingRename" class="secondary">名前を変更</button>
      <button id="buildingReset" class="secondary">リセット</button>
      <button id="buildingDelete" class="secondary danger">削除</button>
      <button id="buildingDeselect" class="secondary">選択解除</button>
    </div>
    <div class="site-map-scroll">
      <svg id="siteMapSvg" viewBox="-300 -300 18400 12700" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="unmatchedWrap">
      <h3 class="unmatched-title">この図には配置されていない置場</h3>
      <div class="map-cards" id="unmatchedCards"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <?!= yardInclude_('yard_capacity_script'); ?>
</body>
</html>
